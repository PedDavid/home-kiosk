name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Render new screenshot baselines (download them from the run's screenshots artifact)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vite build
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Screenshot fixtures are up to date with src/demo.rs
        run: |
          cargo run --quiet --locked --example screen_fixtures
          git diff --exit-code frontend/tests/screens/fixtures
          test -z "$(git status --porcelain frontend/tests/screens/fixtures)"
      - name: Build release binary (frontend embedded)
        run: cargo build --release --locked

  screens:
    # Screenshot tests of the wall view (frontend/tests/screens). The same image as
    # `npm run test:screens:docker` (browsers and fonts included), so baselines rendered on any
    # machine with Docker match CI pixel for pixel. Keep its tag in step with @playwright/test.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only for the screenshots comment on pull requests from this repository.
      pull-requests: write
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - run: npm ci --no-audit --no-fund
      - name: Screenshots and layout at 1280x800
        if: ${{ !inputs.update-screenshots }}
        run: npm run test:screens
      - name: Render new baselines
        if: ${{ inputs.update-screenshots }}
        run: npm run test:screens:update
      - uses: actions/upload-artifact@v4
        id: artifact
        if: ${{ always() }}
        with:
          # The baselines (or the new ones), and on failure each -actual/-diff PNG and the report.
          name: screenshots
          path: |
            frontend/tests/screens/screenshots/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
      # Links the screenshots from the run's summary and, on a pull request from this repository,
      # from one comment that each run updates: the baselines the PR changes, shown from its head
      # commit, the result and the artifact. Nobody has to push images anywhere else.
      - name: Link the screenshots
        if: ${{ always() && steps.artifact.outputs.artifact-url }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const dir = 'frontend/tests/screens/screenshots/';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const result = process.env.OUTCOME === 'success'
              ? 'Screenshots and layout checks passed.'
              : 'Screenshot tests **failed**: the artifact has each `-actual.png` and `-diff.png` under `test-results/`.';
            let lines = ['<!-- screens -->', '### Screenshots (1280×800)', '', result, '', `Artifact: ${process.env.ARTIFACT_URL}`];
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
              const shots = files.filter(f => f.filename.startsWith(dir) && f.filename.endsWith('.png') && f.status !== 'removed');
              lines.push('', shots.length ? `Baselines this PR adds or changes (at ${pr.head.sha.slice(0, 7)}):` : 'This PR changes no baselines.');
              for (const f of shots) {
                const name = f.filename.slice(dir.length, -4);
                lines.push('', `**${name}**`, '', `![${name}](https://raw.githubusercontent.com/${pr.head.repo.full_name}/${pr.head.sha}/${f.filename})`);
              }
            }
            const body = lines.join('\n');
            await core.summary.addRaw(body).write();
            if (!pr || pr.head.repo.full_name !== `${owner}/${repo}`) return; // forks get a read-only token
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('<!-- screens -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint charts/home-hq
      - run: helm lint charts/home-hq -f charts/home-hq/ci/test-values.yaml
      - name: Render with defaults and with every option on
        run: |
          helm template home-hq charts/home-hq > /dev/null
          helm template home-hq charts/home-hq -f charts/home-hq/ci/test-values.yaml
