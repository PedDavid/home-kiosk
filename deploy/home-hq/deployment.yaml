apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-hq
spec:
  # One replica: alerts, frame check-ins and (later) the state file live in this one process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-hq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-hq
    spec:
      # Only needed while the GHCR package is private.
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: home-hq
          image: ghcr.io/peddavid/home-kiosk:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HQ_SETTINGS
              value: /config/settings.json
            - name: HQ_KEY
              valueFrom:
                secretKeyRef:
                  name: home-hq
                  key: HQ_KEY
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: settings
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: settings
          configMap:
            name: home-hq-settings
