apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-hq
spec:
  ingressClassName: traefik
  tls:
    # Served by the existing *.lab.prdv.cloud wildcard certificate. If your other components
    # reference the wildcard Secret explicitly, add the same `secretName` here.
    - hosts:
        - home-hq.lab.prdv.cloud
  rules:
    - host: home-hq.lab.prdv.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-hq
                port:
                  name: http
