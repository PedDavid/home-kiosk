# NOT referenced by kustomization.yaml. The real Secret is created per RFC 004 (encrypted in
# git, or created out of band). Generate the key with: openssl rand -base64 32 | tr '+/' '-_'
apiVersion: v1
kind: Secret
metadata:
  name: home-hq
  namespace: home-hq
type: Opaque
stringData:
  HQ_KEY: change-me
