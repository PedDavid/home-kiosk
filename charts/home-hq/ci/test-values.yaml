# Used by CI: `helm template` with every optional part switched on.
imagePullSecrets: [{ name: ghcr-pull }]
key:
  existingSecret: home-hq
calendars:
  existingSecret: home-hq
ingress:
  host: home-hq.lab.example.com
  tls:
    secretName: wildcard-tls
extraEnv:
  - name: EXAMPLE
    value: "1"
settings:
  timezone: Europe/Lisbon
  location: { lat: 38.7223, lon: -9.1393, units: celsius }
  people:
    - { id: alex, name: Alex, color: "#2D5BFF", ha: person.alex }
    - { id: sam, name: Sam, color: "#E4007C", origin: "Rua Augusta 1, Lisboa" }
  travel:
    osrm: http://osrm.routing.svc.cluster.local:5000
    photon: http://photon.routing.svc.cluster.local:2322
    home: { lat: 38.7223, lon: -9.1393 }
    dailyCap: 300
tls:
  existingSecret: home-hq-tls
lanService:
  enabled: true
  annotations:
    metallb.io/loadBalancerIPs: 192.168.8.56
    external-dns.kubernetes.io/hostname: home-hq.lab.example.com
persistence:
  storageClass: local-path
  annotations:
    helm.sh/resource-policy: keep
