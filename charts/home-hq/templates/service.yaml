apiVersion: v1
kind: Service
metadata:
  name: {{ include "home-hq.fullname" . }}
  labels:
    {{- include "home-hq.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "home-hq.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
