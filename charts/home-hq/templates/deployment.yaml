apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-hq.fullname" . }}
  labels:
    {{- include "home-hq.labels" . | nindent 4 }}
spec:
  # One replica: alerts, frame check-ins and (later) the state file live in this one process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "home-hq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "home-hq.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/settings: {{ toJson .Values.settings | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSecurityContext := deepCopy .Values.podSecurityContext }}
      {{- if and (include "home-hq.persistence" .) (not (hasKey $podSecurityContext "fsGroup")) }}
      {{- /* Lets the non-root user write to provisioners that honour fsGroup; local-path's
             directories are world-writable already. */}}
      {{- $_ := set $podSecurityContext "fsGroup" ($podSecurityContext.runAsGroup | default 65532) }}
      {{- $_ := set $podSecurityContext "fsGroupChangePolicy" "OnRootMismatch" }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      containers:
        - name: home-hq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.tls.existingSecret }}
            - name: https
              containerPort: 8443
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.settings }}
            - name: HQ_SETTINGS
              value: /config/settings.json
            {{- end }}
            {{- if .Values.key.existingSecret }}
            - name: HQ_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.key.existingSecret }}
                  key: {{ .Values.key.secretKey }}
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: HQ_TLS_CERT
              value: /tls/tls.crt
            - name: HQ_TLS_KEY
              value: /tls/tls.key
            {{- end }}
            {{- if include "home-hq.persistence" . }}
            - name: HQ_STATE_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.settings .Values.tls.existingSecret (include "home-hq.persistence" .) }}
          volumeMounts:
            {{- if .Values.settings }}
            - name: settings
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            # Whole Secret, not subPath: subPath mounts never see a renewed certificate.
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- if include "home-hq.persistence" . }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- if or .Values.settings .Values.tls.existingSecret (include "home-hq.persistence" .) }}
      volumes:
        {{- if .Values.settings }}
        - name: settings
          configMap:
            name: {{ include "home-hq.fullname" . }}-settings
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if include "home-hq.persistence" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "home-hq.fullname" .)) }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
