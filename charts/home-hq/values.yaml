image:
  repository: ghcr.io/peddavid/home-kiosk
  # Defaults to the chart's appVersion, so a chart version always runs its matching image.
  tag: ""
  pullPolicy: IfNotPresent

# Needed while the GHCR package is private, e.g. [{ name: ghcr-pull }].
imagePullSecrets: []

# The dashboard key (HQ_KEY) comes from an existing Secret, never from values.
# With no existingSecret the dashboard is open to anyone who can reach it.
key:
  existingSecret: ""
  secretKey: HQ_KEY

# Household settings in upstream Home HQ's settings.json format (timezone, location, people,
# bins, shopping, display). Rendered to JSON in a ConfigMap; any change rolls the pod.
# Empty: the image's bundled example settings are used.
settings: {}

# The shopping list from Mealie. The Secret holds MEALIE_URL (e.g. http://mealie.mealie.svc:9000)
# and MEALIE_TOKEN (an API token from Mealie's user profile); it can be the same Secret as
# key.existingSecret. The list's name goes in the settings: settings.shopping.mealie.list (and,
# optionally, storeLists: { <store id>: <list name> } for stores with a list of their own).
# Empty: the in-memory demo shopping list.
mealie:
  existingSecret: ""
  urlKey: MEALIE_URL
  tokenKey: MEALIE_TOKEN

logLevel: info

# Extra environment variables for the container (later deliveries: HA_TOKEN, calendar URLs, ...).
extraEnv: []

service:
  port: 80

# A kubernetes.io/tls Secret (tls.crt, tls.key) turns on the app's own TLS listener on 8443.
# The whole Secret is mounted, so a renewed certificate is picked up within a minute, no restart.
tls:
  existingSecret: ""

# A second Service straight to the TLS listener: a dedicated LAN address for the dashboard that
# reaches nothing else, so a firewall can allow a kiosk exactly this IP and port. Needs
# tls.existingSecret. Pick the address through annotations, e.g. with MetalLB:
#   metallb.io/loadBalancerIPs: 192.168.8.56
lanService:
  enabled: false
  type: LoadBalancer
  port: 443
  # Local keeps the client's address (no SNAT), so logs show which device connected.
  externalTrafficPolicy: Local
  annotations: {}

ingress:
  enabled: true
  className: traefik
  host: home-hq.example.com
  annotations: {}
  tls:
    enabled: true
    # Empty: Traefik's default certificate (e.g. a wildcard set as the default TLSStore).
    secretName: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  # distroless's nonroot. Numeric, so runAsNonRoot can verify it.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
