image:
  repository: ghcr.io/peddavid/home-kiosk
  # Defaults to the chart's appVersion, so a chart version always runs its matching image.
  tag: ""
  pullPolicy: IfNotPresent

# Needed while the GHCR package is private, e.g. [{ name: ghcr-pull }].
imagePullSecrets: []

# The dashboard key (HQ_KEY) comes from an existing Secret, never from values.
# With no existingSecret the dashboard is open to anyone who can reach it.
key:
  existingSecret: ""
  secretKey: HQ_KEY

# Calendars (HQ_CALENDARS) come from an existing Secret, because the links and CalDAV passwords
# are secrets: a JSON list of ICS feeds and CalDAV calendars, e.g.
#   [ { "url": "https://calendar.google.com/calendar/ical/…/basic.ics", "people": ["sam"] },
#     { "type": "caldav", "id": "family", "url": "https://dav.example/alex/family/",
#       "username": "alex", "password": "…", "people": "all" } ]
# CalDAV calendars can also take events added on the frame; which one an event goes to can be
# set in settings.calendar.writeTo (by id). Empty: the demo calendar. It may be the same Secret
# as `key`.
calendars:
  existingSecret: ""
  secretKey: HQ_CALENDARS

# Household settings in upstream Home HQ's settings.json format (timezone, location, people,
# bins, shopping, display). Rendered to JSON in a ConfigMap; any change rolls the pod.
# Empty: the image's bundled example settings are used.
settings: {}

immich:
  # The Immich address people's phones open (HQ_IMMICH_PUBLIC_URL), e.g. https://photos.example.com.
  # The Photos tab's Share button shows a QR code for <publicUrl>/photos/<assetId>: a plain link,
  # no key, so whoever scans it signs in to Immich with their own login. Use the public address,
  # not a cluster-internal one a phone can't reach. Empty: the Share button is hidden.
  publicUrl: ""

logLevel: info

# Weather. "open-meteo" fetches settings.location's forecast from Open-Meteo (no key, cached
# 15 minutes), so the pod needs egress to api.open-meteo.com (or to openMeteoUrl's host); the
# frame itself never calls it. "demo" serves the generated demo forecast and makes no calls.
weather:
  provider: open-meteo
  # Empty: https://api.open-meteo.com/v1/forecast. Set for a self-hosted Open-Meteo.
  openMeteoUrl: ""

# Extra environment variables for the container (later deliveries: HA_TOKEN, calendar URLs, ...).
extraEnv: []

service:
  port: 80

# A small writable volume for state that must survive restarts. Today that is the Immich device
# grant from QR pairing, encrypted with a key derived from HQ_KEY. On by default, but only takes
# effect with key.existingSecret: without HQ_KEY nothing would be written, so no claim is made.
# Mounted at mountPath and passed to the app as HQ_STATE_DIR; the root filesystem stays read-only.
# Needs a default StorageClass (or storageClass/existingClaim). Off: the grant lives in memory and
# every restart or deploy needs pairing again.
persistence:
  enabled: true
  # Use this PVC instead of creating one.
  existingClaim: ""
  # Empty: the cluster's default StorageClass (local-path on k3s).
  storageClass: ""
  # ReadWriteOnce is enough: one replica, and the Recreate strategy stops the old pod first.
  accessMode: ReadWriteOnce
  # local-path doesn't enforce sizes; the grant file is under 1 KiB.
  size: 16Mi
  mountPath: /data
  # e.g. helm.sh/resource-policy: keep, to keep the claim on uninstall.
  annotations: {}

# A kubernetes.io/tls Secret (tls.crt, tls.key) turns on the app's own TLS listener on 8443.
# The whole Secret is mounted, so a renewed certificate is picked up within a minute, no restart.
tls:
  existingSecret: ""

# A second Service straight to the TLS listener: a dedicated LAN address for the dashboard that
# reaches nothing else, so a firewall can allow a kiosk exactly this IP and port. Needs
# tls.existingSecret. Pick the address through annotations, e.g. with MetalLB:
#   metallb.io/loadBalancerIPs: 192.168.8.56
lanService:
  enabled: false
  type: LoadBalancer
  port: 443
  # Local keeps the client's address (no SNAT), so logs show which device connected.
  externalTrafficPolicy: Local
  annotations: {}

ingress:
  enabled: true
  className: traefik
  host: home-hq.example.com
  annotations: {}
  tls:
    enabled: true
    # Empty: Traefik's default certificate (e.g. a wildcard set as the default TLSStore).
    secretName: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  # distroless's nonroot. Numeric, so runAsNonRoot can verify it.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
